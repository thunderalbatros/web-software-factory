<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>Curso de Fotografía Digital — Meta Ads High-Visibility Creative Suite</title>
  <style>
    :root {
      /* Apple HIG Display + Google Material 3 De-Boxed High-Contrast Tokens */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;

      --text-white: #FFFFFF;

      /* Theme 1 (Default): ÁMBAR EDITORIAL (Warm amber/orange atmosphere from Reference 2 + crisp white/gold type) */
      --accent-main: #FBBF24;
      --accent-badge-bg: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
      --accent-badge-text: #120901;
      --accent-glow: rgba(245, 158, 11, 0.45);

      --photo-filter: grayscale(100%) sepia(88%) hue-rotate(-15deg) saturate(2.55) contrast(1.10) brightness(0.84);
      --backdrop-scrim:
        radial-gradient(circle at 65% 44%, rgba(217, 119, 6, 0.24) 0%, rgba(20, 10, 3, 0.68) 82%),
        linear-gradient(
          95deg,
          rgba(16, 8, 2, 0.78) 0%,
          rgba(24, 12, 3, 0.56) 58%,
          rgba(28, 14, 4, 0.36) 100%
        ),
        linear-gradient(
          180deg,
          rgba(14, 7, 2, 0.58) 0%,
          rgba(18, 9, 3, 0.34) 48%,
          rgba(12, 6, 2, 0.82) 100%
        );
    }

    /* Theme 2: ESMERALDA STUDIO (Original emerald/teal atmosphere from Reference 1 + crisp white/emerald type) */
    body[data-theme="emerald"] {
      --accent-main: #34D399;
      --accent-badge-bg: linear-gradient(135deg, #34D399 0%, #10B981 100%);
      --accent-badge-text: #02140D;
      --accent-glow: rgba(16, 185, 129, 0.45);

      --photo-filter: saturate(1.28) contrast(1.10) brightness(0.82);
      --backdrop-scrim:
        radial-gradient(circle at 65% 44%, rgba(16, 185, 129, 0.18) 0%, rgba(3, 14, 11, 0.70) 82%),
        linear-gradient(
          95deg,
          rgba(3, 14, 11, 0.78) 0%,
          rgba(4, 18, 14, 0.54) 58%,
          rgba(5, 22, 17, 0.34) 100%
        ),
        linear-gradient(
          180deg,
          rgba(3, 12, 9, 0.56) 0%,
          rgba(4, 16, 12, 0.32) 48%,
          rgba(2, 10, 8, 0.84) 100%
        );
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow: hidden;
      background: #080808;
      font-family: var(--font-sans);
      color: var(--text-white);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ==========================================================================
       META ADS PLACEMENT DIMENSIONS & SAFE ZONES
       ========================================================================== */
    /* 1. Feed 4:5 (1080 x 1350 px) */
    .ad-canvas {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 92px 86px 90px;
    }

    /* 2. Feed 1:1 (1080 x 1080 px) */
    body[data-format="feed-1x1"] .ad-canvas {
      width: 1080px;
      height: 1080px;
      padding: 68px 82px 68px;
    }

    /* 3. Story / Reels 9:16 (1080 x 1920 px)
       Respects Meta Top 14% (~268px) and Bottom 22% (~420px) UI Safe Zones */
    body[data-format="story-9x16"] .ad-canvas {
      width: 1080px;
      height: 1920px;
      padding: 276px 86px 410px;
    }

    /* ==========================================================================
       BACKGROUND PHOTOGRAPH + DIRECTIONAL SCRIM (PRESERVES CAMERA VISIBILITY)
       ========================================================================== */
    .photo-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 38%;
      filter: var(--photo-filter);
      transform-origin: 55% 46%;
      will-change: transform;
    }

    .photo-scrim {
      position: absolute;
      inset: 0;
      background: var(--backdrop-scrim);
      pointer-events: none;
    }

    /* Subtle viewfinder frame corners */
    .viewfinder-hud {
      position: absolute;
      inset: 38px;
      pointer-events: none;
      z-index: 2;
    }

    body[data-format="story-9x16"] .viewfinder-hud {
      top: 230px;
      bottom: 366px;
      left: 42px;
      right: 42px;
    }

    .vf-corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: rgba(255, 255, 255, 0.36);
      border-style: solid;
    }
    .vf-corner.tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 8px; }
    .vf-corner.tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 8px; }
    .vf-corner.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 8px; }
    .vf-corner.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 8px; }

    /* ==========================================================================
       LEVEL 1 (TOP): MASSIVE DISPLAY HEADLINE + LOCATION
       ("CURSO de FOTOGRAFÍA DIGITAL" / "en San Martín GBA.")
       ========================================================================== */
    .title-group {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    body[data-format="feed-1x1"] .title-group {
      gap: 16px;
    }

    .main-headline {
      font-size: 112px;
      font-weight: 950;
      line-height: 0.96;
      letter-spacing: -0.032em;
      color: var(--text-white);
      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.65),
        0 10px 28px rgba(0, 0, 0, 0.95),
        0 20px 48px rgba(0, 0, 0, 0.90);
    }

    body[data-format="feed-1x1"] .main-headline {
      font-size: 98px;
      line-height: 0.95;
    }

    body[data-format="story-9x16"] .main-headline {
      font-size: 114px;
      line-height: 0.97;
    }

    .main-headline .de-word {
      font-weight: 850;
      color: var(--text-white);
    }

    .main-headline .accent-word {
      color: var(--accent-main);
    }

    .subtitle-location {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      font-size: 60px;
      font-weight: 850;
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: var(--text-white);
      text-shadow:
        0 3px 0 rgba(0, 0, 0, 0.65),
        0 8px 24px rgba(0, 0, 0, 0.95),
        0 14px 36px rgba(0, 0, 0, 0.9);
      border-left: 10px solid var(--accent-main);
      padding-left: 22px;
    }

    body[data-format="feed-1x1"] .subtitle-location {
      font-size: 52px;
      border-left-width: 8px;
      padding-left: 18px;
    }

    body[data-format="story-9x16"] .subtitle-location {
      font-size: 62px;
    }

    /* ==========================================================================
       LEVEL 2 (MIDDLE): DE-BOXED LARGE STACKED BULLETS (LIKE REFERENCE 2, MAXIMUM SIZE)
       • Presencial
       • Certificado
       • Cupos limitados
       ========================================================================== */
    .benefits-stack {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-left: 6px;
    }

    body[data-format="feed-1x1"] .benefits-stack {
      gap: 16px;
    }

    body[data-format="story-9x16"] .benefits-stack {
      gap: 30px;
    }

    .benefit-row {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 66px;
      font-weight: 900;
      letter-spacing: -0.022em;
      line-height: 1.05;
      color: var(--text-white);
      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.72),
        0 10px 26px rgba(0, 0, 0, 0.96),
        0 18px 44px rgba(0, 0, 0, 0.92);
    }

    body[data-format="feed-1x1"] .benefit-row {
      font-size: 56px;
      gap: 22px;
    }

    body[data-format="story-9x16"] .benefit-row {
      font-size: 68px;
      gap: 28px;
    }

    .benefit-bullet {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent-main);
      box-shadow:
        0 0 18px var(--accent-main),
        0 4px 10px rgba(0, 0, 0, 0.9);
      flex-shrink: 0;
    }

    body[data-format="feed-1x1"] .benefit-bullet {
      width: 22px;
      height: 22px;
    }

    /* ==========================================================================
       LEVEL 3 (BOTTOM): HIGH-CONTRAST START DATE BANNER ("Inicio: 14/11/26")
       ========================================================================== */
    .start-date-banner {
      position: relative;
      z-index: 4;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 28px 36px;
      border-radius: 26px;
      background: var(--accent-badge-bg);
      color: var(--accent-badge-text);
      border: 3px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 20px 48px rgba(0, 0, 0, 0.85),
        0 0 36px var(--accent-glow),
        inset 0 2px 0 rgba(255, 255, 255, 0.65);
    }

    body[data-format="feed-1x1"] .start-date-banner {
      padding: 22px 30px;
      border-radius: 22px;
    }

    .date-text {
      font-size: 68px;
      font-weight: 950;
      letter-spacing: -0.025em;
      line-height: 1;
      color: var(--accent-badge-text);
    }

    body[data-format="feed-1x1"] .date-text {
      font-size: 60px;
    }

    body[data-format="story-9x16"] .date-text {
      font-size: 70px;
    }

    .calendar-icon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      stroke: var(--accent-badge-text);
    }

    body[data-format="feed-1x1"] .calendar-icon {
      width: 48px;
      height: 48px;
    }
  </style>
</head>
<body data-format="feed-4x5" data-theme="amber">

  <main class="ad-canvas" id="ad-canvas">
    <!-- 1. Background Photograph + High-Contrast Scrim -->
    <div class="photo-layer">
      <img
        src="./assets/hero-photographer.jpg"
        alt="Curso de Fotografía Digital en San Martín GBA"
        class="photo-img"
        id="photo-img"
      />
      <div class="photo-scrim"></div>
    </div>

    <!-- Subtle Viewfinder Corners -->
    <div class="viewfinder-hud" id="viewfinder-hud">
      <div class="vf-corner tl"></div>
      <div class="vf-corner tr"></div>
      <div class="vf-corner bl"></div>
      <div class="vf-corner br"></div>
    </div>

    <!-- LEVEL 1: Primary Headline + Location (Top Zone) -->
    <header class="title-group" id="title-group">
      <h1 class="main-headline">
        CURSO <span class="de-word">de</span><br />
        FOTOGRAFÍA<br />
        <span class="accent-word">DIGITAL</span>
      </h1>
      <p class="subtitle-location">
        en San Martín GBA.
      </p>
    </header>

    <!-- LEVEL 2: De-Boxed Giant Stacked Benefits (Middle Zone) -->
    <section class="benefits-stack" id="benefits-row" aria-label="Beneficios del curso">
      <div class="benefit-row" id="chip-1">
        <span class="benefit-bullet"></span>
        <span>Presencial</span>
      </div>
      <div class="benefit-row" id="chip-2">
        <span class="benefit-bullet"></span>
        <span>Certificado</span>
      </div>
      <div class="benefit-row" id="chip-3">
        <span class="benefit-bullet"></span>
        <span>Cupos limitados</span>
      </div>
    </section>

    <!-- LEVEL 3: High-Impact Start Date Banner (Bottom Zone) -->
    <footer class="start-date-banner" id="start-date-card">
      <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span class="date-text">Inicio: 14/11/26</span>
    </footer>
  </main>

  <script>
    (function initMetaAdCanvas() {
      const params = new URLSearchParams(window.location.search);
      const format = params.get('format') || 'feed-4x5';
      const theme = params.get('theme') || 'amber';
      document.body.setAttribute('data-format', format);
      document.body.setAttribute('data-theme', theme);

      const photoImg = document.getElementById('photo-img');
      const titleGroup = document.getElementById('title-group');
      const chip1 = document.getElementById('chip-1');
      const chip2 = document.getElementById('chip-2');
      const chip3 = document.getElementById('chip-3');
      const dateCard = document.getElementById('start-date-card');

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function clamp01(v) {
        return Math.min(1, Math.max(0, v));
      }

      function progressWindow(t, start, duration) {
        return easeOutCubic(clamp01((t - start) / duration));
      }

      function renderAtTime(sec) {
        const TOTAL_DUR = 6.0;
        const t = clamp01(sec / TOTAL_DUR);

        // 1. Subtle Ken Burns zoom & drift on the background portrait
        const scale = 1.10 - 0.10 * easeOutCubic(t);
        const panY = -12 * Math.sin(t * Math.PI);
        photoImg.style.transform = `scale(${scale.toFixed(4)}) translate3d(0, ${panY.toFixed(2)}px, 0)`;

        // 2. Main Headline & Location
        const titleP = progressWindow(sec, 0.05, 0.50);
        titleGroup.style.opacity = (0.15 + 0.85 * titleP).toFixed(3);
        titleGroup.style.transform = `translate3d(0, ${((1 - titleP) * 28).toFixed(2)}px, 0)`;

        // 3. Staggered Giant Benefit Rows (Presencial, Certificado, Cupos limitados)
        const c1P = progressWindow(sec, 0.25, 0.45);
        const c2P = progressWindow(sec, 0.40, 0.45);
        const c3P = progressWindow(sec, 0.55, 0.45);

        chip1.style.opacity = c1P.toFixed(3);
        chip1.style.transform = `translate3d(${((1 - c1P) * -28).toFixed(2)}px, 0, 0)`;

        chip2.style.opacity = c2P.toFixed(3);
        chip2.style.transform = `translate3d(${((1 - c2P) * -28).toFixed(2)}px, 0, 0)`;

        chip3.style.opacity = c3P.toFixed(3);
        chip3.style.transform = `translate3d(${((1 - c3P) * -28).toFixed(2)}px, 0, 0)`;

        // 4. Start Date Banner ("Inicio: 14/11/26")
        const dateP = progressWindow(sec, 0.70, 0.50);
        const pulseScale = sec > 1.25 ? 1 + 0.015 * Math.sin((sec - 1.25) * 4.2) : 0.92 + 0.08 * dateP;
        dateCard.style.opacity = dateP.toFixed(3);
        dateCard.style.transform = `translate3d(0, ${((1 - dateP) * 24).toFixed(2)}px, 0) scale(${pulseScale.toFixed(4)})`;
      }

      window.__setAdTime = renderAtTime;

      if (params.get('autoplay') === '1') {
        const start = performance.now();
        function loop(now) {
          const elapsed = ((now - start) / 1000) % 6.0;
          renderAtTime(elapsed);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      } else {
        renderAtTime(2.5);
      }
    })();
  </script>
</body>
</html>
