<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>twennythree — Brand Identity & Kick.com About Me Panels (Apple HIG / MD3)</title>
  <style>
    :root {
      --surface-canvas-deep: #060c18;
      --surface-canvas-mid: #0a1528;
      --surface-card-base: #091326;
      --surface-card-elevated: #0f203c;
      --surface-squircle: #112445;

      --border-specular-outer: rgba(77, 158, 255, 0.44);
      --border-specular-top: rgba(245, 250, 255, 0.22);
      --border-squircle: rgba(147, 197, 253, 0.32);

      --text-ice-white: #f8fafc;
      --text-silver-blue: #94a3b8;
      --accent-sapphire-bright: #60a5fa;
      --accent-sapphire-deep: #2563eb;
      --accent-cyan-glow: #38bdf8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      color: var(--text-ice-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 64px;
    }

    .showcase-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .row-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: flex-start;
    }

    /* ==========================================================================
       1. TWENNYTHREE LOGO — AVATAR / ISOTYPE (1000x1000)
       ========================================================================== */
    .logo-avatar-box {
      position: relative;
      width: 1000px;
      height: 1000px;
      border-radius: 220px; /* Apple HIG continuous squircle proportion */
      overflow: hidden;
      background:
        radial-gradient(680px 680px at 50% 42%, rgba(37, 99, 235, 0.34) 0%, transparent 72%),
        radial-gradient(500px 500px at 50% 88%, rgba(56, 189, 248, 0.18) 0%, transparent 70%),
        linear-gradient(155deg, #0b1933 0%, #060d1b 55%, #040812 100%);
      border: 4px solid rgba(96, 165, 250, 0.48);
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.28),
        inset 0 0 110px rgba(2, 6, 15, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-avatar-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ==========================================================================
       2. TWENNYTHREE LOGO — HORIZONTAL LOCKUP BANNER (1200x400)
       ========================================================================== */
    .logo-horizontal-box {
      position: relative;
      width: 1200px;
      height: 400px;
      border-radius: 44px;
      overflow: hidden;
      background:
        radial-gradient(620px 320px at 22% 50%, rgba(37, 99, 235, 0.30) 0%, transparent 74%),
        radial-gradient(580px 280px at 78% 50%, rgba(56, 189, 248, 0.16) 0%, transparent 74%),
        linear-gradient(135deg, #0a1730 0%, #060c19 54%, #040811 100%);
      border: 2.5px solid rgba(96, 165, 250, 0.42);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 70px rgba(2, 6, 14, 0.90);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       3. KICK.COM "ABOUT ME" PANELS (640x200 RETINA — 2x OF 320x100 STANDARD)
       Apple HIG Concentricity: Outer R = 28px | Padding = 24px | Squircle R = 20px
       ========================================================================== */
    .kick-panel-grid {
      display: grid;
      grid-template-columns: repeat(2, 640px);
      gap: 28px;
    }

    .kick-panel {
      position: relative;
      width: 640px;
      height: 200px;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(380px 180px at 18% 50%, rgba(37, 99, 235, 0.28) 0%, transparent 72%),
        radial-gradient(320px 160px at 88% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 75%),
        linear-gradient(135deg, #0b1830 0%, #071020 55%, #050a15 100%);
      border: 2px solid var(--border-specular-outer);
      box-shadow:
        inset 0 1.5px 0 var(--border-specular-top),
        inset 0 0 40px rgba(2, 6, 14, 0.85);
      display: flex;
      align-items: center;
      padding: 0 34px 0 26px;
      gap: 28px;
    }

    /* Subtle micro-grid inside panel */
    .kick-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(96, 165, 250, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96, 165, 250, 0.025) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, transparent 85%);
      -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, transparent 85%);
      pointer-events: none;
    }

    /* Specular diagonal corner rim */
    .kick-panel::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 28px;
      background: linear-gradient(
        135deg,
        rgba(224, 242, 254, 0.45) 0%,
        transparent 22%,
        transparent 78%,
        rgba(56, 189, 248, 0.32) 100%
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 2px;
      pointer-events: none;
    }

    /* Elevated Icon Container (Apple HIG Squircle) */
    .panel-icon-squircle {
      position: relative;
      z-index: 2;
      width: 136px;
      height: 136px;
      flex-shrink: 0;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 32%, rgba(59, 130, 246, 0.32) 0%, rgba(11, 23, 46, 0.94) 76%);
      border: 1.5px solid var(--border-squircle);
      box-shadow:
        0 12px 28px rgba(2, 6, 14, 0.78),
        0 0 22px rgba(59, 130, 246, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-icon-squircle svg {
      width: 68px;
      height: 68px;
      color: var(--text-ice-white);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 14px rgba(96, 165, 250, 0.35));
    }

    .panel-icon-squircle svg.stake-icon-svg {
      width: 106px;
      height: auto;
    }

    /* Typography Stack inside Labeled Panels */
    .panel-copy {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .panel-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-sapphire-bright);
    }

    .panel-eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-cyan-glow);
      box-shadow: 0 0 8px var(--accent-cyan-glow);
    }

    .panel-title {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.02;
      color: var(--text-ice-white);
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #dbeafe 65%, #93c5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.65));
    }

    /* Subtle right chevron indicator */
    .panel-chevron {
      position: relative;
      z-index: 2;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 32, 60, 0.72);
      border: 1px solid rgba(147, 197, 253, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-sapphire-bright);
    }

    .panel-chevron svg {
      width: 20px;
      height: 20px;
    }

    /* ==========================================================================
       4. ICON-ONLY (ZERO-TEXT) KICK.COM PANELS (640x200 RETINA)
       ========================================================================== */
    .kick-panel.is-icon-only {
      justify-content: center;
      padding: 0;
      background:
        radial-gradient(360px 170px at 50% 50%, rgba(37, 99, 235, 0.30) 0%, transparent 72%),
        linear-gradient(135deg, #0b1830 0%, #071020 55%, #050a15 100%);
    }

    .kick-panel.is-icon-only .center-emblem-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.28) 0%, rgba(10, 21, 42, 0.90) 76%);
      border: 1.5px solid rgba(147, 197, 253, 0.34);
      box-shadow:
        0 14px 32px rgba(2, 6, 14, 0.82),
        0 0 28px rgba(59, 130, 246, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    .kick-panel.is-icon-only .center-emblem-wrap svg {
      width: 74px;
      height: 74px;
      color: var(--text-ice-white);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 16px rgba(96, 165, 250, 0.38));
    }

    .kick-panel.is-icon-only .center-stake-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 310px;
      height: 140px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.26) 0%, rgba(10, 21, 42, 0.88) 78%);
      border: 1.5px solid rgba(147, 197, 253, 0.32);
      box-shadow:
        0 14px 32px rgba(2, 6, 14, 0.82),
        0 0 28px rgba(59, 130, 246, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .kick-panel.is-icon-only .center-stake-wrap svg {
      width: 196px;
      height: auto;
      color: var(--text-ice-white);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 18px rgba(96, 165, 250, 0.38));
    }
  </style>
</head>
