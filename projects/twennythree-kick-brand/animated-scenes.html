<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
  <title>twennythree — Animated Broadcast Scenes (Starting Soon &amp; Stream Ending 60FPS)</title>
  <style>
    :root {
      /* ==========================================================================
         OKLCH DARK BLUE SURFACE HIERARCHY (Apple HIG + Material Design 3)
         ========================================================================== */
      --surface-canvas-deep: oklch(0.115 0.032 258);       /* #050a14 */
      --surface-canvas-mid: oklch(0.155 0.044 256);        /* #0a1528 */
      --surface-glass-pill: rgba(9, 20, 40, 0.84);
      --border-specular-outer: rgba(96, 165, 250, 0.36);
      --border-specular-top: rgba(255, 255, 255, 0.22);

      --text-ice-white: #f8fafc;
      --text-silver-muted: #94a3b8;
      --accent-sapphire: #60a5fa;
      --accent-cyan: #38bdf8;
      --accent-royal: #2563eb;

      /* Emil Kowalski / Apple HIG Easing Curves */
      --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040812;
      color: var(--text-ice-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .scene-viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      overflow: hidden;
      background:
        radial-gradient(1100px 680px at 50% 44%, rgba(29, 78, 216, 0.30) 0%, transparent 72%),
        radial-gradient(760px 520px at 16% 22%, rgba(56, 189, 248, 0.13) 0%, transparent 70%),
        radial-gradient(760px 520px at 84% 78%, rgba(37, 99, 235, 0.16) 0%, transparent 70%),
        linear-gradient(145deg, #081326 0%, #050b17 52%, #03060d 100%);
    }

    /* Architectural Micro-Grid */
    .scene-viewport::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(96, 165, 250, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96, 165, 250, 0.022) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 46%, rgba(0, 0, 0, 0.80) 0%, transparent 86%);
      -webkit-mask-image: radial-gradient(circle at 50% 46%, rgba(0, 0, 0, 0.80) 0%, transparent 86%);
      pointer-events: none;
      z-index: 1;
    }

    /* Studio Perimeter Vignette */
    .scene-viewport::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 150px rgba(1, 3, 9, 0.90);
      pointer-events: none;
      z-index: 2;
    }

    /* ==========================================================================
       OUTER APPLE HIG PERIMETER FRAME WITH SPECULAR LIGHT SWEEP
       ========================================================================== */
    .perimeter-hud-frame {
      position: absolute;
      inset: 34px;
      border-radius: 24px;
      border: 1.5px solid rgba(96, 165, 250, 0.28);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 0 40px rgba(15, 35, 75, 0.35);
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }

    /* Corner Calibration Reticles */
    .hud-corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: rgba(147, 197, 253, 0.38);
      border-style: solid;
    }
    .hud-corner.tl { top: 18px; left: 18px; border-width: 2px 0 0 2px; border-top-left-radius: 6px; }
    .hud-corner.tr { top: 18px; right: 18px; border-width: 2px 2px 0 0; border-top-right-radius: 6px; }
    .hud-corner.bl { bottom: 18px; left: 18px; border-width: 0 0 2px 2px; border-bottom-left-radius: 6px; }
    .hud-corner.br { bottom: 18px; right: 18px; border-width: 0 2px 2px 0; border-bottom-right-radius: 6px; }

    /* Ambient Floating Bokeh Canvas (GPU Composited) */
    .bokeh-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .bokeh-orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.85) 0%, rgba(59, 130, 246, 0.35) 45%, transparent 72%);
      will-change: transform, opacity;
    }

    /* ==========================================================================
       CENTER STAGE: ROTATING CASINO ROULETTE RINGS & "23" MONOGRAM
       ========================================================================== */
    .center-stage {
      position: absolute;
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 1200px;
    }

    /* Background Concentric Pulse Waves */
    .ambient-wave-ring {
      position: absolute;
      left: 50%;
      top: 205px;
      width: 680px;
      height: 680px;
      margin-left: -340px;
      margin-top: -340px;
      border-radius: 50%;
      border: 1.5px solid rgba(96, 165, 250, 0.14);
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Top Status Pill (Apple HIG Glass Pill) */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 46px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--surface-glass-pill);
      border: 1.5px solid rgba(147, 197, 253, 0.38);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.72),
        0 0 24px rgba(59, 130, 246, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #e2e8f0;
      margin-bottom: 24px;
    }

    .status-pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
      will-change: transform, opacity;
    }

    body[data-scene="ending"] .status-pulse-dot {
      background: #60a5fa;
      box-shadow: 0 0 12px #60a5fa;
    }

    /* Emblem Wrapper (310x310) */
    .emblem-stage {
      position: relative;
      width: 310px;
      height: 310px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
    }

    .emblem-glow-backdrop {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.42) 0%, rgba(56, 189, 248, 0.14) 48%, transparent 72%);
      will-change: transform, opacity;
    }

    .emblem-svg {
      position: relative;
      width: 310px;
      height: 310px;
      overflow: visible;
      filter: drop-shadow(0 20px 44px rgba(0, 0, 0, 0.85));
    }

    /* Headline Lockup with Specular Light Sweep */
    .headline-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
    }

    .headline-text {
      font-size: 88px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.02;
      text-align: center;
      text-transform: uppercase;
      color: var(--text-ice-white);
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.8));
    }

    .headline-accent {
      background: linear-gradient(135deg, #e0f2fe 0%, #60a5fa 46%, #2563eb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subheadline-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-silver-muted);
      margin-bottom: 28px;
    }

    .subheadline-line {
      width: 48px;
      height: 2px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #60a5fa, transparent);
    }

    /* ==========================================================================
       DYNAMIC PROGRESS / COUNTDOWN MODULE (CASINO HIGH-ROLLER BAR)
       ========================================================================== */
    .progress-module {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 520px;
    }

    .countdown-timer-pill {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 24px;
      border-radius: 14px;
      background: rgba(8, 18, 36, 0.90);
      border: 1px solid rgba(96, 165, 250, 0.34);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #f8fafc;
    }

    body[data-has-countdown="1"] .countdown-timer-pill {
      display: inline-flex;
    }

    .progress-track {
      position: relative;
      width: 460px;
      height: 6px;
      border-radius: 999px;
      background: rgba(15, 32, 60, 0.78);
      border: 1px solid rgba(147, 197, 253, 0.20);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .progress-shimmer-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -45%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent 0%, #2563eb 25%, #60a5fa 60%, #e0f2fe 85%, transparent 100%);
      box-shadow: 0 0 16px rgba(96, 165, 250, 0.85);
      will-change: transform;
    }

    /* ==========================================================================
       BOTTOM SOCIAL & PARTNER TICKER DOCK (WITH SEQUENTIAL ACTIVE HIGHLIGHT)
       ========================================================================== */
    .bottom-social-dock {
      position: absolute;
      bottom: 66px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 22px;
      border-radius: 22px;
      background: rgba(7, 16, 32, 0.86);
      border: 1.5px solid rgba(96, 165, 250, 0.30);
      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.82),
        0 0 28px rgba(37, 99, 235, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .social-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 46px;
      padding: 0 20px;
      border-radius: 14px;
      background: rgba(13, 28, 54, 0.68);
      border: 1px solid rgba(147, 197, 253, 0.18);
      color: #cbd5e1;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      will-change: transform, opacity;
    }

    .social-pill svg {
      width: 20px;
      height: 20px;
      color: #60a5fa;
    }

    .social-pill svg.stake-wordmark {
      width: 62px;
      height: 28px;
      color: #f8fafc;
    }

    .social-pill.badge-18 {
      padding: 0 16px;
      color: #93c5fd;
      border-color: rgba(96, 165, 250, 0.28);
    }

    /* Active Highlight Overlay inside each Social Pill (driven by 60FPS loop) */
    .social-pill-glow {
      position: absolute;
      inset: -1px;
      border-radius: 14px;
      border: 1.5px solid #60a5fa;
      background: radial-gradient(circle at 50% 0%, rgba(96, 165, 250, 0.28) 0%, transparent 75%);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }
  </style>
</head>

    <!-- Outer Apple HIG Frame -->

      <div class="hud-corner tl"></div>
      <div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div>
      <div class="hud-corner br"></div>
    </div>

    <!-- GPU Floating Sapphire Bokeh Layer -->
    <div class="bokeh-layer" id="bokeh-layer"></div>

    <!-- Center Stage -->
    <section class="center-stage">
      <!-- Expanding Concentric Pulse Rings -->
      <div class="ambient-wave-ring" id="wave-ring-1"></div>
      <div class="ambient-wave-ring" id="wave-ring-2"></div>

      <!-- Top Status Pill -->
      <div class="status-pill">
        <span class="status-pulse-dot" id="status-pulse-dot"></span>
        <span id="status-pill-label">LIVE CASINO BROADCAST</span>
      </div>

      <!-- Animated "23" Roulette / Token Emblem -->
      <div class="emblem-stage">
        <div class="emblem-glow-backdrop" id="emblem-glow-backdrop"></div>
        <svg class="emblem-svg" viewBox="0 0 800 800">
          <!-- Static Deep Sapphire Core -->
          <circle cx="400" cy="400" r="356" fill="rgba(7, 15, 32, 0.90)" />

          <!-- Outer Clockwise Rotating Roulette Ring + Cardinal Diamonds -->
          <g id="ring-outer-cw" style="transform-origin: 400px 400px;">
            <circle cx="400" cy="400" r="356" fill="none" stroke="url(#t23-ring-grad)" stroke-width="5.5" />
            <polygon points="400,26 416,46 400,66 384,46" fill="#60a5fa" />
            <polygon points="400,734 416,754 400,774 384,754" fill="#60a5fa" />
            <polygon points="26,400 46,384 66,400 46,416" fill="#60a5fa" />
            <polygon points="734,400 754,384 774,400 754,416" fill="#60a5fa" />
            <!-- 4 Diagonal Luminous Ticks -->
            <circle cx="652" cy="148" r="5" fill="#bae6fd" />
            <circle cx="148" cy="148" r="5" fill="#bae6fd" />
            <circle cx="652" cy="652" r="5" fill="#bae6fd" />
            <circle cx="148" cy="652" r="5" fill="#bae6fd" />
          </g>

          <!-- Middle Counter-Clockwise Dashed Casino Wheel Ring -->
          <g id="ring-mid-ccw" style="transform-origin: 400px 400px;">
            <circle cx="400" cy="400" r="318" fill="none" stroke="rgba(96, 165, 250, 0.34)" stroke-width="3.5" stroke-dasharray="26 18" />
          </g>

          <!-- Inner Precision Ring -->
          <circle cx="400" cy="400" r="284" fill="none" stroke="rgba(147, 197, 253, 0.16)" stroke-width="2" />

          <!-- "23" Monogram Group (Subtle Levitation) -->
          <g id="monogram-23-group" style="transform-origin: 400px 400px;">
            <g transform="translate(-100, -32)">
              <path
                transform="translate(-22, 0)"
                d="M 255 348 C 255 282, 306 242, 384 242 C 458 242, 502 280, 502 338 C 502 380, 480 412, 430 452 L 336 528 H 504 V 598 H 248 V 534 L 382 422 C 414 395, 426 374, 426 346 C 426 318, 405 302, 376 302 C 345 302, 326 320, 324 352 Z"
                fill="url(#t23-ice-grad)"
              />
              <path
                transform="translate(22, 0)"
                d="M 526 246 H 752 V 308 L 658 400 C 718 412, 760 452, 760 510 C 760 578, 706 624, 624 624 C 552 624, 502 588, 492 528 L 564 512 C 572 546, 594 562, 626 562 C 662 562, 684 542, 684 510 C 684 478, 660 458, 616 458 H 586 V 402 L 672 312 H 526 Z"
                fill="url(#t23-sapphire-grad)"
              />
              <!-- Center Pulsing 4-Point Diamond Spark -->
              <path
                id="center-diamond-spark"
                style="transform-origin: 500px 434px;"
                d="M 500 396 Q 500 434 538 434 Q 500 434 500 472 Q 500 434 462 434 Q 500 434 500 396 Z"
                fill="#e0f2fe"
              />
            </g>
          </g>
        </svg>
      </div>

      <!-- Main Headline -->
      <div class="headline-wrap">
        <h1 class="headline-text" id="scene-headline">
          STARTING <span class="headline-accent">SOON</span>
        </h1>
      </div>

      <!-- Subheadline -->
      <div class="subheadline-row">
        <span class="subheadline-line"></span>
        <span id="scene-subheadline">TWENNYTHREE — HIGH ROLLER CASINO STREAM</span>
        <span class="subheadline-line"></span>
      </div>

      <!-- Progress / Countdown Bar -->
      <div class="progress-module">
        <div class="countdown-timer-pill" id="countdown-pill">05:00</div>
        <div class="progress-track">
          <div class="progress-shimmer-bar" id="progress-shimmer-bar"></div>
        </div>
      </div>
    </section>

    <!-- Bottom Social & Casino Partner Dock -->
    <footer class="bottom-social-dock" id="bottom-social-dock">
      <div class="social-pill" data-pill-idx="0">
        <div class="social-pill-glow"></div>
        <svg><use href="#icon-discord"></use></svg>
        <span>DISCORD</span>
      </div>
      <div class="social-pill" data-pill-idx="1">
        <div class="social-pill-glow"></div>
        <svg><use href="#icon-instagram"></use></svg>
        <span>INSTAGRAM</span>
      </div>
      <div class="social-pill" data-pill-idx="2">
        <div class="social-pill-glow"></div>
        <svg><use href="#icon-x"></use></svg>
        <span>FOLLOW ON X</span>
      </div>
      <div class="social-pill" data-pill-idx="3">
        <div class="social-pill-glow"></div>
        <svg class="stake-wordmark"><use href="#icon-stake"></use></svg>
      </div>
      <div class="social-pill badge-18" data-pill-idx="4">
        <div class="social-pill-glow"></div>
        <span>18+ PLAY RESPONSIBLY</span>
      </div>
    </footer>
  </main>

  <script>
    (function initAnimatedBroadcastScene() {
      const viewport = document.getElementById('scene-viewport');
      const params = new URLSearchParams(window.location.search);

      function syncScale() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        viewport.style.transform = `scale(${scale})`;
      }
      window.addEventListener('resize', syncScale);
      syncScale();

      // Configure Scene Mode: starting (default) | ending | brb
      const sceneMode = params.get('scene') || 'starting';
      document.body.setAttribute('data-scene', sceneMode);

      const statusLabel = document.getElementById('status-pill-label');
      const headline = document.getElementById('scene-headline');
      const subheadline = document.getElementById('scene-subheadline');

      if (sceneMode === 'ending') {
        statusLabel.textContent = 'SESSION COMPLETE';
        headline.innerHTML = 'STREAM <span class="headline-accent">ENDING</span>';
        subheadline.textContent = 'THANKS FOR WATCHING TWENNYTHREE — SEE YOU NEXT STREAM';
      } else if (sceneMode === 'brb') {
        statusLabel.textContent = 'SHORT INTERMISSION';
        headline.innerHTML = 'BE RIGHT <span class="headline-accent">BACK</span>';
        subheadline.textContent = 'TWENNYTHREE — STAY TUNED IN THE CHAT';
      } else {
        statusLabel.textContent = 'LIVE CASINO BROADCAST';
        headline.innerHTML = 'STARTING <span class="headline-accent">SOON</span>';
        subheadline.textContent = 'TWENNYTHREE — HIGH ROLLER CASINO STREAM';
      }

      // Optional live MM:SS countdown when ?mins=5 is passed in OBS Browser Source
      const minsParam = parseFloat(params.get('mins') || '0');
      const countdownEl = document.getElementById('countdown-pill');
      let countdownTotalSec = minsParam > 0 ? Math.round(minsParam * 60) : 0;
      if (countdownTotalSec > 0) {
        document.body.setAttribute('data-has-countdown', '1');
      }

      // Create 18 deterministic ambient sapphire bokeh orbs
      const bokehLayer = document.getElementById('bokeh-layer');
      const orbs = [];
      const orbConfigs = [
        { x: 220, y: 820, size: 14, phase: 0.0, ampX: 18, ampY: 42 },
        { x: 340, y: 320, size: 10, phase: 1.1, ampX: 14, ampY: 36 },
        { x: 480, y: 680, size: 18, phase: 2.3, ampX: 22, ampY: 48 },
        { x: 180, y: 460, size: 8,  phase: 3.4, ampX: 12, ampY: 30 },
        { x: 640, y: 210, size: 12, phase: 4.2, ampX: 16, ampY: 38 },
        { x: 580, y: 860, size: 15, phase: 5.1, ampX: 20, ampY: 44 },
        { x: 1280, y: 220, size: 12, phase: 0.7, ampX: 16, ampY: 36 },
        { x: 1440, y: 720, size: 16, phase: 1.9, ampX: 20, ampY: 46 },
        { x: 1620, y: 340, size: 11, phase: 2.8, ampX: 15, ampY: 34 },
        { x: 1740, y: 620, size: 14, phase: 3.9, ampX: 18, ampY: 40 },
        { x: 1340, y: 860, size: 10, phase: 4.8, ampX: 14, ampY: 32 },
        { x: 1560, y: 180, size: 9,  phase: 5.6, ampX: 12, ampY: 28 }
      ];

      orbConfigs.forEach((cfg) => {
        const el = document.createElement('div');
        el.className = 'bokeh-orb';
        el.style.width = `${cfg.size}px`;
        el.style.height = `${cfg.size}px`;
        el.style.left = `${cfg.x}px`;
        el.style.top = `${cfg.y}px`;
        bokehLayer.appendChild(el);
        orbs.push({ el, ...cfg });
      });

      const ringOuterCw = document.getElementById('ring-outer-cw');
      const ringMidCcw = document.getElementById('ring-mid-ccw');
      const monogramGroup = document.getElementById('monogram-23-group');
      const centerDiamond = document.getElementById('center-diamond-spark');
      const emblemGlow = document.getElementById('emblem-glow-backdrop');
      const statusDot = document.getElementById('status-pulse-dot');
      const wave1 = document.getElementById('wave-ring-1');
      const wave2 = document.getElementById('wave-ring-2');
      const shimmerBar = document.getElementById('progress-shimmer-bar');
      const socialGlows = Array.from(document.querySelectorAll('.social-pill-glow'));
      const socialPills = Array.from(document.querySelectorAll('.social-pill'));

      // Seamless Loop Period: LOOP_SEC = 4.0 seconds (240 frames @ 60 FPS)
      const LOOP_SEC = 4.0;
      const TWO_PI = Math.PI * 2;

      function renderAtTime(tSec) {
        const progress = (tSec % LOOP_SEC) / LOOP_SEC; // [0, 1)
        const angleRad = progress * TWO_PI;

        // 1. Roulette Rings Rotation (90 deg per loop = exact 4-fold cardinal symmetry!)
        const outerDeg = progress * 90;
        const innerDeg = -progress * 90;
        ringOuterCw.style.transform = `rotate(${outerDeg.toFixed(3)}deg)`;
        ringMidCcw.style.transform = `rotate(${innerDeg.toFixed(3)}deg)`;

        // 2. "23" Monogram Subtle Vertical Levitation & Center Spark Pulse
        const floatY = Math.sin(angleRad) * -5.5;
        monogramGroup.style.transform = `translate3d(0, ${floatY.toFixed(2)}px, 0)`;

        const sparkScale = 1 + 0.22 * Math.sin(angleRad * 2);
        centerDiamond.style.transform = `scale(${sparkScale.toFixed(3)})`;

        // 3. Emblem Backdrop Halo & Status Dot Pulse
        const glowScale = 1 + 0.08 * Math.sin(angleRad);
        const glowOpacity = 0.72 + 0.28 * Math.sin(angleRad);
        emblemGlow.style.transform = `scale(${glowScale.toFixed(3)})`;
        emblemGlow.style.opacity = glowOpacity.toFixed(3);

        const dotScale = 1 + 0.24 * Math.sin(angleRad * 2);
        const dotOp = 0.65 + 0.35 * Math.sin(angleRad * 2);
        statusDot.style.transform = `scale(${dotScale.toFixed(3)})`;
        statusDot.style.opacity = dotOp.toFixed(3);

        // 4. Dual Expanding Sonar Wave Rings (Seamless Handoff)
        const w1Phase = progress;
        const w2Phase = (progress + 0.5) % 1.0;
        const w1Scale = 0.65 + w1Phase * 0.55;
        const w1Op = Math.sin(w1Phase * Math.PI) * 0.55;
        wave1.style.transform = `scale(${w1Scale.toFixed(3)})`;
        wave1.style.opacity = w1Op.toFixed(3);

        const w2Scale = 0.65 + w2Phase * 0.55;
        const w2Op = Math.sin(w2Phase * Math.PI) * 0.55;
        wave2.style.transform = `scale(${w2Scale.toFixed(3)})`;
        wave2.style.opacity = w2Op.toFixed(3);

        // 5. Progress Shimmer Bar (Smooth Ping-Pong Sweep across 460px track)
        const shimmerX = (0.5 - 0.5 * Math.cos(angleRad)) * 460;
        shimmerBar.style.transform = `translate3d(${shimmerX.toFixed(2)}px, 0, 0)`;

        // 6. Floating Bokeh Orbs (Closed Lissajous / Harmonic Orbit = 100% Seamless Loop)
        for (let i = 0; i < orbs.length; i++) {
          const o = orbs[i];
          const dx = Math.cos(angleRad + o.phase) * o.ampX;
          const dy = Math.sin(angleRad + o.phase) * o.ampY;
          const op = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(angleRad + o.phase * 1.5));
          o.el.style.transform = `translate3d(${dx.toFixed(2)}px, ${dy.toFixed(2)}px, 0)`;
          o.el.style.opacity = op.toFixed(3);
        }

        // 7. Sequential Active Glow Wave across Bottom Social Pills
        const totalPills = socialGlows.length;
        const activeFloat = progress * totalPills;
        for (let i = 0; i < totalPills; i++) {
          let dist = Math.abs(activeFloat - i);
          if (dist > totalPills / 2) dist = totalPills - dist;
          const intensity = Math.max(0, 1 - dist * 1.35);
          socialGlows[i].style.opacity = intensity.toFixed(3);
          const liftY = intensity * -3.5;
          socialPills[i].style.transform = `translate3d(0, ${liftY.toFixed(2)}px, 0)`;
        }

        // 8. Optional Live Countdown Formatting
        if (countdownTotalSec > 0 && countdownEl) {
          const rem = Math.max(0, countdownTotalSec - Math.floor(tSec));
          const mm = String(Math.floor(rem / 60)).padStart(2, '0');
          const ss = String(rem % 60).padStart(2, '0');
          countdownEl.textContent = `${mm}:${ss}`;
        }
      }

      // Expose deterministic hook for Playwright 60FPS video renderer
      window.__setSceneTime = renderAtTime;

      if (params.get('manual') !== '1') {
        const startPerf = performance.now();
        function tick(now) {
          const elapsedSec = (now - startPerf) / 1000;
          renderAtTime(elapsedSec);
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      } else {
        renderAtTime(0);
      }
    })();
  </script>
