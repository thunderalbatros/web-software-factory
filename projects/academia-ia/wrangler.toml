name = "academia-ia"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
PUBLIC_BRAND_NAME = "Academia Libre"
COMPLIANCE_PROFILE = "education"

[[d1_databases]]
binding = "DB"
database_name = "academia-libre-db"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "academia-libre-avatars"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

[ratelimits.simple]
limit = 30
period = 60

[[durable_objects.bindings]]
name = "LEVEL_CHAT_ROOMS"
class_name = "LevelChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LevelChatRoom"]

[ai]
binding = "AI"
