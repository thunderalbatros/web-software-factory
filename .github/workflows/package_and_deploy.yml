name: Cloud Standalone ZIP Packaging & Cloudflare Preview Deploy

# OWASP GitHub Actions Security Cheat Sheet & Zizmor Hardened Workflow:
# - Packages standalone `<slug>-produccion.zip` without factory dependencies
# - Retains `.zip` and visual audit captures for 90 days as GitHub Actions Artifacts
# - Deploys to Cloudflare Pages/Workers if secrets exist, or skips cleanly with Exit Code 0
# - Enforces `persist-credentials: false`, explicit `permissions:`, and zero `${{ ... }}` in `run:`
on:
  push:
    branches:
      - 'main'
    paths:
      - 'projects/**'
      - 'deliverables/**'
  workflow_dispatch:
    inputs:
      project_slug:
        description: 'Project slug to package & deploy (default: agencia-alfa)'
        required: true
        default: 'agencia-alfa'
        type: string

permissions: {}

jobs:
  package-and-cloudflare-preview:
    name: Build Standalone ZIP (90-Day Artifact) & Conditional Cloudflare Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 1. Checkout Repository (Zero Credential Persistence)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Install Dependencies
        run: |
          npm ci

      - name: 4. Build Standalone Deliverable & Generate <slug>-produccion.zip
        env:
          PROJECT_SLUG: ${{ inputs.project_slug || 'agencia-alfa' }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const slug = String(process.env.PROJECT_SLUG || "agencia-alfa").replace(/[^a-z0-9-]/gi, "");
            execFileSync(process.execPath, ["tools/build_dist.mjs", "--project", slug, "--package"], { stdio: "inherit" });
            const zipPath = path.join("deliverables", slug, `${slug}-produccion.zip`);
            if (!fs.existsSync(zipPath)) {
              console.error(`Expected ZIP archive not found at ${zipPath}`);
              process.exit(1);
            }
          '

      - name: 5. Upload Standalone Production ZIP & Visual Captures (90 Days Retention)
        uses: actions/upload-artifact@v4
        with:
          name: standalone-produccion-zip-and-visual-audit
          path: |
            deliverables/*/*-produccion.zip
            deliverables/*/COMO_PUBLICAR_ESTE_SITIO.md
            tools/audit/out/*.png
            docs/audit_snapshots/
          retention-days: 90

      - name: 6. Conditional Cloudflare Pages/Workers Preview Deployment
        env:
          PROJECT_SLUG: ${{ inputs.project_slug || 'agencia-alfa' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { execFileSync } = require("node:child_process");

            const slug = String(process.env.PROJECT_SLUG || "agencia-alfa").replace(/[^a-z0-9-]/gi, "");
            const cfToken = String(process.env.CLOUDFLARE_API_TOKEN || "").trim();
            const cfAccount = String(process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
            const distPath = path.join("deliverables", slug, "dist");

            const lines = [
              `## 📦 Paquete Autónomo Generado: \`${slug}-produccion.zip\``,
              "",
              `- **Archivo descargable (90 días):** \`deliverables/${slug}/${slug}-produccion.zip\``,
              `- **Guía incluida:** \`deliverables/${slug}/COMO_PUBLICAR_ESTE_SITIO.md\``
            ];

            if (cfToken && cfAccount) {
              try {
                const out = execFileSync("npx", [
                  "wrangler",
                  "pages",
                  "deploy",
                  distPath,
                  "--project-name",
                  slug
                ], { encoding: "utf8" });
                const urlMatch = out.match(/https:\/\/[a-zA-Z0-9.-]+\.pages\.dev/);
                const liveUrl = urlMatch ? urlMatch[0] : `https://${slug}.pages.dev`;
                lines.push(`- **🌐 URL en Vivo (Cloudflare Pages):** ${liveUrl}`);
              } catch (err) {
                lines.push(`- **⚠️ Aviso de Despliegue Cloudflare:** ${err.message}`);
              }
            } else {
              lines.push("- **ℹ️ Despliegue Externo Omitido Limpiamente (`Exit Code 0`):** Los secrets `CLOUDFLARE_API_TOKEN` y `CLOUDFLARE_ACCOUNT_ID` aún no están configurados. Podés descargar el `.zip` desde la sección **Artifacts** de esta corrida.");
            }

            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n", "utf8");
            }
            console.log(lines.join("\n"));
            process.exit(0);
          '
